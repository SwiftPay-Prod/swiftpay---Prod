services:
  # ============================================
  # DATABASES
  # ============================================

  swiftpaydb:
    container_name: swiftpaydb
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: safefyuser
      POSTGRES_PASSWORD: safefypassword
      POSTGRES_DB: safefy
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - swiftpaydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaylogsdb:
    container_name: swiftpaylogsdb
    image: postgres:15.15-alpine3.22
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: logsuser
      POSTGRES_PASSWORD: logspassword
      POSTGRES_DB: safefylogs
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - swiftpaylogsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  # ============================================
  # MAIL SERVER
  # ============================================

  swiftpaymail:
    container_name: swiftpaymail
    image: mailhog/mailhog:latest
    ports:
      - '8025:8025'
      - '1025:1025'

  # ============================================
  # MESSAGE BROKER
  # ============================================

  swiftpayrabbitmq:
    container_name: swiftpayrabbitmq
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: safefyuser
      RABBITMQ_DEFAULT_PASS: safefypassword
      RABBITMQ_DEFAULT_VHOST: safefy
    volumes:
      - swiftpayrabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CACHE (SESSION STORE)
  # ============================================

  swiftpayvalkey:
    container_name: swiftpayvalkey
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - swiftpayvalkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # LOCAL OBJECT STORAGE
  # ============================================

  swiftpaystorage:
    container_name: swiftpaystorage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${LOCAL_STORAGE_ACCESS_KEY:-local_dev_storage_access_key}
      MINIO_ROOT_PASSWORD: ${LOCAL_STORAGE_SECRET_KEY:-local_dev_storage_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - swiftpaystorage_data:/data

  swiftpaystorage-init:
    container_name: swiftpaystorage-init
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      swiftpaystorage:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set swiftpaystorage http://swiftpaystorage:9000 ${LOCAL_STORAGE_ACCESS_KEY:-local_dev_storage_access_key} ${LOCAL_STORAGE_SECRET_KEY:-local_dev_storage_secret_key}; do sleep 2; done;
      mc mb --ignore-existing swiftpaystorage/safefy-storage;
      mc anonymous set download swiftpaystorage/safefy-storage;
      "

  # ============================================
  # APPLICATIONS
  # ============================================

  swiftpayapi:
    container_name: swiftpayapi
    build:
      context: ..
      dockerfile: safefy-api/Dockerfile.development
      args:
        GITHUB_USER: dummy
        GITHUB_TOKEN: dummy
    image: swiftpayapi:latest
    ports:
      - '5279:5279'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PlatformSettings__BaseUrl: http://localhost:3001
      PlatformSettings__MaxLoginAttempts: 5
      PaymentApi__BaseUrl: http://swiftpayapipayment:5166/
      PaymentApi__InternalApiKey: ${LOCAL_INTERNAL_API_KEY:-local_dev_internal_api_key_change_me}
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=safefy;Username=safefyuser;Password=safefypassword;
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=safefylogs;Username=logsuser;Password=logspassword;
      JWTSettings__Secret: ${LOCAL_API_JWT_SECRET:-local_dev_api_jwt_secret_change_me_2026}
      JWTSettings__Issuer: safefypay
      JWTSettings__Audience: safefypay
      JWTSettings__TokenExpire: 86400
      JWTSettings__RefreshTokenExpire: 604800
      EmailSettings__Provider: Smtp
      EmailSettings__FromEmail: noreply@safefypay.com.br
      EmailSettings__FromName: SWIFTPAY
      EmailSettings__EnableSend: true
      EmailSettings__Smtp__Host: swiftpaymail
      EmailSettings__Smtp__Port: 1025
      EmailSettings__Smtp__Username:
      EmailSettings__Smtp__Password:
      EmailSettings__Smtp__EnableSsl: false
      StorageSettings__Endpoint: swiftpaystorage:9000
      StorageSettings__AccessKey: ${LOCAL_STORAGE_ACCESS_KEY:-local_dev_storage_access_key}
      StorageSettings__SecretKey: ${LOCAL_STORAGE_SECRET_KEY:-local_dev_storage_secret_key}
      StorageSettings__BucketName: safefy-storage
      StorageSettings__UseSSL: false
      StorageSettings__PublicUrl: http://localhost:9000/safefy-storage
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: 5672
      RabbitMQSettings__UserName: safefyuser
      RabbitMQSettings__Password: safefypassword
      RabbitMQSettings__VirtualHost: safefy
      ValkeySettings__ConnectionString: swiftpayvalkey:6379
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpaymail:
        condition: service_started
      swiftpayrabbitmq:
        condition: service_healthy
      swiftpayvalkey:
        condition: service_healthy
      swiftpaystorage:
        condition: service_started
      swiftpaystorage-init:
        condition: service_completed_successfully

  swiftpayapipayment:
    container_name: swiftpayapipayment
    build:
      context: ..
      dockerfile: safefy-api-payment/Dockerfile
      args:
        GITHUB_USER: dummy
        GITHUB_TOKEN: dummy
    image: swiftpayapipayment:latest
    ports:
      - '5166:5166'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=safefy;Username=safefyuser;Password=safefypassword;
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=safefylogs;Username=logsuser;Password=logspassword;
      JWTSettings__Secret: ${LOCAL_PAYMENT_JWT_SECRET:-local_dev_payment_jwt_secret_change_me_2026}
      PlatformSettings__BaseUrl: http://swiftpayapi:5279
      PlatformSettings__ApiVersion: v1
      PlatformSettings__InternalApiKey: ${LOCAL_INTERNAL_API_KEY:-local_dev_internal_api_key_change_me}
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: 5672
      RabbitMQSettings__UserName: safefyuser
      RabbitMQSettings__Password: safefypassword
      RabbitMQSettings__VirtualHost: safefy
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpayapi:
        condition: service_started
      swiftpayrabbitmq:
        condition: service_healthy

  swiftpayweb:
    container_name: swiftpayweb
    build:
      context: ../safefy-web
    image: swiftpayweb:latest
    ports:
      - '3001:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://swiftpayapi:5279
      INTERNAL_API_URL: http://swiftpayapi:5279
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_DOCS_URL: http://localhost:3001/docs
    depends_on:
      swiftpayapi:
        condition: service_started
      swiftpayapipayment:
        condition: service_started

# ============================================
# VOLUMES
# ============================================
volumes:
  swiftpaydb_data:
  swiftpaylogsdb_data:
  grafana_data:
  swiftpaystorage_data:
  swiftpayrabbitmq_data:
  swiftpayvalkey_data:
