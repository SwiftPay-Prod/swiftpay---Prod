services:
  swiftpaydb:
    container_name: swiftpaydb
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: swiftpayuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swiftpaypassword}
      POSTGRES_DB: swiftpay
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - swiftpaydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  swiftpaylogsdb:
    container_name: swiftpaylogsdb
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: logsuser
      POSTGRES_PASSWORD: ${LOGS_DB_PASSWORD:-logspassword}
      POSTGRES_DB: swiftpaylogs
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=50"
    volumes:
      - swiftpaylogsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  swiftpayrabbitmq:
    container_name: swiftpayrabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftpayuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swiftpaypassword}
      RABBITMQ_DEFAULT_VHOST: swiftpay
    volumes:
      - swiftpayrabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpayvalkey:
    container_name: swiftpayvalkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - swiftpayvalkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaystorage:
    container_name: swiftpaystorage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-local_dev_storage_access_key}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-local_dev_storage_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - swiftpaystorage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaystorage-init:
    container_name: swiftpaystorage-init
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      swiftpaystorage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-local_dev_storage_access_key}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-local_dev_storage_secret_key}
    entrypoint: >
      /bin/sh -c "
      until mc alias set swiftpaystorage http://swiftpaystorage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing swiftpaystorage/swiftpay-storage;
      mc anonymous set download swiftpaystorage/swiftpay-storage;
      "

  swiftpayapi:
    container_name: swiftpayapi
    build:
      context: ..
      dockerfile: swiftpay-api/Dockerfile
    image: swiftpayapi:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5279:5279"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5279
      PlatformSettings__BaseUrl: https://swift-pay.top
      PlatformSettings__CheckoutBaseUrl: https://swift-pay.top/checkout
      PlatformSettings__MaxLoginAttempts: "5"
      PlatformSettings__InternalApiKey: ${INTERNAL_API_KEY?err}
      PaymentApi__BaseUrl: http://swiftpayapipayment:5166/
      PaymentApi__InternalApiKey: ${INTERNAL_API_KEY?err}
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=swiftpay;Username=swiftpayuser;Password=${DB_PASSWORD?err}
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=swiftpaylogs;Username=logsuser;Password=${LOGS_DB_PASSWORD?err}
      JWTSettings__Secret: ${API_JWT_SECRET?err}
      JWTSettings__Issuer: swiftpay
      JWTSettings__Audience: swiftpay
      JWTSettings__TokenExpire: "86400"
      JWTSettings__RefreshTokenExpire: "604800"
      EmailSettings__Provider: Resend
      EmailSettings__FromEmail: noreply@swift-pay.top
      EmailSettings__FromName: SWIFTPAY
      EmailSettings__EnableSend: "true"
      EmailSettings__Resend__ApiKey: ${RESEND_API_KEY?err}
      StorageSettings__Endpoint: swiftpaystorage:9000
      StorageSettings__AccessKey: ${STORAGE_ACCESS_KEY?err}
      StorageSettings__SecretKey: ${STORAGE_SECRET_KEY?err}
      StorageSettings__BucketName: swiftpay-storage
      StorageSettings__UseSSL: "false"
      StorageSettings__PublicUrl: https://swift-pay.top/api/storage
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: "5672"
      RabbitMQSettings__UserName: ${RABBITMQ_USER:-swiftpayuser}
      RabbitMQSettings__Password: ${RABBITMQ_PASSWORD?err}
      RabbitMQSettings__VirtualHost: swiftpay
      ValkeySettings__ConnectionString: swiftpayvalkey:6379
      FirebaseSettings__Enabled: ${FIREBASE_ENABLED:-false}
      FirebaseSettings__ProjectId: ${FIREBASE_PROJECT_ID:-swiftpay-878c0}
      FirebaseSettings__PrivateKeyId: ${FIREBASE_PRIVATE_KEY_ID:-}
      FirebaseSettings__PrivateKey: ${FIREBASE_PRIVATE_KEY:-}
      FirebaseSettings__ClientEmail: ${FIREBASE_CLIENT_EMAIL:-}
      FirebaseSettings__ClientId: ${FIREBASE_CLIENT_ID:-}
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpayrabbitmq:
        condition: service_healthy
      swiftpayvalkey:
        condition: service_healthy
      swiftpaystorage:
        condition: service_started
      swiftpaystorage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5279/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  swiftpayapipayment:
    container_name: swiftpayapipayment
    build:
      context: ..
      dockerfile: swiftpay-api-payment/Dockerfile
    image: swiftpayapipayment:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5166:5166"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5166
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=swiftpay;Username=swiftpayuser;Password=${DB_PASSWORD?err}
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=swiftpaylogs;Username=logsuser;Password=${LOGS_DB_PASSWORD?err}
      JWTSettings__Secret: ${PAYMENT_JWT_SECRET?err}
      PlatformSettings__BaseUrl: https://swift-pay.top
      PlatformSettings__ApiVersion: v1
      PlatformSettings__InternalApiKey: ${INTERNAL_API_KEY?err}
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: "5672"
      RabbitMQSettings__UserName: ${RABBITMQ_USER:-swiftpayuser}
      RabbitMQSettings__Password: ${RABBITMQ_PASSWORD?err}
      RabbitMQSettings__VirtualHost: swiftpay
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpayapi:
        condition: service_started
      swiftpayrabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5166/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  swiftpayweb:
    container_name: swiftpayweb
    build:
      context: ../swiftpay-web
      dockerfile: Dockerfile
    image: swiftpayweb:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://swift-pay.top/api
      INTERNAL_API_URL: http://swiftpayapi:5279
      NEXT_PUBLIC_APP_URL: https://swift-pay.top
      NEXT_PUBLIC_DOCS_URL: https://swift-pay.top/docs
    depends_on:
      swiftpayapi:
        condition: service_healthy
      swiftpayapipayment:
        condition: service_healthy
    healthcheck:
      test: curl -sf -o /dev/null http://127.0.0.1:3000/ || curl -sf -o /dev/null http://127.0.0.1:3000/pay/health || true
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  swiftpaywebcheckout:
    container_name: swiftpaywebcheckout
    build:
      context: ../swiftpay-web-checkout
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SWIFTPAY_API_PAYMENT_URL: https://swift-pay.top/api/payment
    image: swiftpaywebcheckout:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    environment:
      INTERNAL_SWIFTPAY_API_PAYMENT_URL: http://swiftpayapipayment:5166
      NEXT_PUBLIC_SWIFTPAY_API_PAYMENT_URL: https://swift-pay.top/api/payment
    depends_on:
      swiftpayapipayment:
        condition: service_healthy
    healthcheck:
      test: curl -sf -o /dev/null http://127.0.0.1:3000/ || curl -sf -o /dev/null http://127.0.0.1:3000/pay/health || true
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  swiftpaydb_data:
  swiftpaylogsdb_data:
  swiftpaystorage_data:
  swiftpayrabbitmq_data:
  swiftpayvalkey_data:
