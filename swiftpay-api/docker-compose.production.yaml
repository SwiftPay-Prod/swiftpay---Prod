version: "3.8"

services:
  swiftpaydb:
    container_name: swiftpaydb
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiftpay
      POSTGRES_PASSWORD: ${DB_PASSWORD?err}
      POSTGRES_DB: swiftpay
    volumes:
      - swiftpaydb_data:/var/lib/postgresql/data
    networks:
      - swiftpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftpay -d swiftpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaylogsdb:
    container_name: swiftpaylogsdb
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiftpaylogs
      POSTGRES_PASSWORD: ${LOGS_DB_PASSWORD?err}
      POSTGRES_DB: swiftpaylogs
    volumes:
      - swiftpaylogsdb_data:/var/lib/postgresql/data
    networks:
      - swiftpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftpaylogs -d swiftpaylogs"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpayrabbitmq:
    container_name: swiftpayrabbitmq
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftpayuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?err}
    volumes:
      - swiftpayrabbitmq_data:/var/lib/rabbitmq
    networks:
      - swiftpay-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  swiftpayvalkey:
    container_name: swiftpayvalkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - swiftpayvalkey_data:/data
    networks:
      - swiftpay-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaystorage:
    container_name: swiftpaystorage
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY?err}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY?err}
    volumes:
      - swiftpaystorage_data:/data
    networks:
      - swiftpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  swiftpayapi:
    build:
      context: ..
      dockerfile: swiftpay-api/Dockerfile
    image: swiftpayapi:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpayrabbitmq:
        condition: service_healthy
      swiftpayvalkey:
        condition: service_healthy
      swiftpaystorage:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=swiftpaydb;Database=swiftpay;Username=swiftpay;Password=${DB_PASSWORD?err}
      ConnectionStrings__LogsDb: Host=swiftpaylogsdb;Database=swiftpaylogs;Username=swiftpaylogs;Password=${LOGS_DB_PASSWORD?err}
      RabbitMQ__Host: swiftpayrabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER:-swiftpayuser}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD?err}
      StorageSettings__AccessKey: ${STORAGE_ACCESS_KEY?err}
      StorageSettings__SecretKey: ${STORAGE_SECRET_KEY?err}
      StorageSettings__ServiceUrl: http://swiftpaystorage:9000
      ApiSettings__JwtSecret: ${API_JWT_SECRET?err}
      InternalApiSettings__ApiKey: ${INTERNAL_API_KEY?err}
      EmailSettings__Resend__ApiKey: ${RESEND_API_KEY?err}
      EmailPlatformSettings__Enabled: "true"
      FirebaseSettings__Enabled: "false"
    secrets:
      - firebase-email-worker
    networks:
      - swiftpay-network

  swiftpayapipayment:
    build:
      context: ..
      dockerfile: swiftpay-api-payment/Dockerfile
    image: swiftpayapipayment:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpaydb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=swiftpaydb;Database=swiftpay;Username=swiftpay;Password=${DB_PASSWORD?err}
      ApiSettings__JwtSecret: ${PAYMENT_JWT_SECRET?err}
      InternalApiSettings__ApiKey: ${INTERNAL_API_KEY?err}
    networks:
      - swiftpay-network

  swiftpayweb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: swiftpayweb:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://swiftpayment.info/api
      NEXT_PUBLIC_FIREBASE_AUTH_API_KEY: ${NEXT_PUBLIC_FIREBASE_AUTH_API_KEY?err}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-swiftpay-878c0.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID:-swiftpay-878c0}
    networks:
      - swiftpay-network

  swiftpaywebcheckout:
    container_name: swiftpaywebcheckout
    build:
      context: ../swiftpay-web-checkout
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SWIFTPAY_API_PAYMENT_URL: https://swiftpayment.info/api/payment
    image: swiftpaywebcheckout:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpayapipayment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/checkout/pay"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - swiftpay-network

secrets:
  firebase-email-worker:
    file: /run/secrets/firebase-email-worker.json

volumes:
  swiftpaydb_data:
  swiftpaylogsdb_data:
  swiftpaystorage_data:
  swiftpayrabbitmq_data:
  swiftpayvalkey_data:

networks:
  swiftpay-network:
    driver: bridge
