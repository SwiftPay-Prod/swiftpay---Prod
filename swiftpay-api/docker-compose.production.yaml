version: "3.8"

services:
  swiftpaydb:
    container_name: swiftpaydb
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: swiftpayuser
      POSTGRES_PASSWORD: ${DB_PASSWORD?err}
      POSTGRES_DB: swiftpay
    volumes:
      - swiftpaydb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftpayuser -d swiftpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaylogsdb:
    container_name: swiftpaylogsdb
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: logsuser
      POSTGRES_PASSWORD: ${LOGS_DB_PASSWORD?err}
      POSTGRES_DB: swiftpaylogs
    volumes:
      - swiftpaylogsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsuser -d swiftpaylogs"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpayrabbitmq:
    container_name: swiftpayrabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftpayuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?err}
      RABBITMQ_DEFAULT_VHOST: swiftpay
    volumes:
      - swiftpayrabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  swiftpayvalkey:
    container_name: swiftpayvalkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - swiftpayvalkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  swiftpaystorage:
    container_name: swiftpaystorage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY?err}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY?err}
    volumes:
      - swiftpaystorage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  swiftpayapi:
    container_name: swiftpayapi
    build:
      context: ..
      dockerfile: swiftpay-api/Dockerfile
    image: swiftpayapi:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpaydb:
        condition: service_healthy
      swiftpaylogsdb:
        condition: service_healthy
      swiftpayrabbitmq:
        condition: service_healthy
      swiftpayvalkey:
        condition: service_healthy
      swiftpaystorage:
        condition: service_healthy
    ports:
      - "127.0.0.1:5279:5279"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5279
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=swiftpay;Username=swiftpayuser;Password=${DB_PASSWORD?err}
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=swiftpaylogs;Username=logsuser;Password=${LOGS_DB_PASSWORD?err}
      RabbitMQSettings__Enabled: "true"
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: "5672"
      RabbitMQSettings__UserName: ${RABBITMQ_USER:-swiftpayuser}
      RabbitMQSettings__Password: ${RABBITMQ_PASSWORD?err}
      RabbitMQSettings__VirtualHost: swiftpay
      ValkeySettings__ConnectionString: swiftpayvalkey:6379
      StorageSettings__AccessKey: ${STORAGE_ACCESS_KEY?err}
      StorageSettings__SecretKey: ${STORAGE_SECRET_KEY?err}
      StorageSettings__Endpoint: swiftpaystorage:9000
      StorageSettings__BucketName: swiftpay-storage
      StorageSettings__PublicUrl: https://swiftpayment.info/api/storage
      StorageSettings__UseSSL: "false"
      JWTSettings__Secret: ${API_JWT_SECRET?err}
      JWTSettings__Issuer: swiftpay
      JWTSettings__Audience: swiftpay
      JWTSettings__TokenExpire: "86400"
      JWTSettings__RefreshTokenExpire: "604800"
      PlatformSettings__BaseUrl: https://swiftpayment.info
      PlatformSettings__CheckoutBaseUrl: https://swiftpayment.info/checkout
      PlatformSettings__InternalApiKey: ${INTERNAL_API_KEY?err}
      PlatformSettings__MaxLoginAttempts: "5"
      PaymentApi__BaseUrl: http://swiftpayapipayment:5166/
      PaymentApi__InternalApiKey: ${INTERNAL_API_KEY?err}
      EmailSettings__EnableSend: "true"
      EmailSettings__Provider: Resend
      EmailSettings__FromEmail: noreply@swiftpayment.info
      EmailSettings__FromName: SWIFTPAY
      EmailSettings__Resend__ApiKey: ${RESEND_API_KEY?err}
      EmailPlatformSettings__Enabled: "true"
      EmailPlatformSettings__FirebaseProjectId: swiftpay-878c0
      FirebaseSettings__Enabled: "true"
      FirebaseSettings__ProjectId: swiftpay-878c0
      FirebaseSettings__ClientEmail: ""
      FirebaseSettings__ClientId: ""
      FirebaseSettings__PrivateKeyId: ""
      FirebaseSettings__PrivateKey: ""
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-email-worker.json
    volumes:
      - /run/secrets/firebase-email-worker.json:/run/secrets/firebase-email-worker.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5279/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  swiftpayapipayment:
    container_name: swiftpayapipayment
    build:
      context: ..
      dockerfile: swiftpay-api-payment/Dockerfile
    image: swiftpayapipayment:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpaydb:
        condition: service_healthy
    ports:
      - "127.0.0.1:5166:5166"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5166
      DatabaseSettings__ConnectionString: Host=swiftpaydb;Port=5432;Database=swiftpay;Username=swiftpayuser;Password=${DB_PASSWORD?err}
      LogsDatabaseSettings__ConnectionString: Host=swiftpaylogsdb;Port=5432;Database=swiftpaylogs;Username=logsuser;Password=${LOGS_DB_PASSWORD?err}
      RabbitMQSettings__Enabled: "true"
      RabbitMQSettings__HostName: swiftpayrabbitmq
      RabbitMQSettings__Port: "5672"
      RabbitMQSettings__UserName: ${RABBITMQ_USER:-swiftpayuser}
      RabbitMQSettings__Password: ${RABBITMQ_PASSWORD?err}
      RabbitMQSettings__VirtualHost: swiftpay
      JWTSettings__Secret: ${PAYMENT_JWT_SECRET?err}
      PlatformSettings__ApiVersion: v1
      PlatformSettings__BaseUrl: https://swiftpayment.info
      PlatformSettings__InternalApiKey: ${INTERNAL_API_KEY?err}
      EmailSettings__EnableSend: "true"
      EmailSettings__Provider: Resend
      EmailSettings__FromEmail: noreply@swiftpayment.info
      EmailSettings__FromName: SWIFTPAY
      EmailSettings__Resend__ApiKey: ${RESEND_API_KEY?err}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5166/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  swiftpayweb:
    container_name: swiftpayweb
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://swiftpayment.info/api
        NEXT_PUBLIC_PAYMENT_API_URL: https://swiftpayment.info/api/payment
        NEXT_PUBLIC_APP_URL: https://swiftpayment.info
        NEXT_PUBLIC_DOCS_URL: https://swiftpayment.info/docs
        NEXT_PUBLIC_FIREBASE_AUTH_API_KEY: ${NEXT_PUBLIC_FIREBASE_AUTH_API_KEY?err}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-swiftpay-878c0.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID:-swiftpay-878c0}
    image: swiftpayweb:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_API_URL: http://swiftpayapi:5279
      NEXT_PUBLIC_API_URL: https://swiftpayment.info/api
      NEXT_PUBLIC_PAYMENT_API_URL: https://swiftpayment.info/api/payment
      NEXT_PUBLIC_APP_URL: https://swiftpayment.info
      NEXT_PUBLIC_DOCS_URL: https://swiftpayment.info/docs
      NEXT_PUBLIC_FIREBASE_AUTH_API_KEY: ${NEXT_PUBLIC_FIREBASE_AUTH_API_KEY?err}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-swiftpay-878c0.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_AUTH_PROJECT_ID:-swiftpay-878c0}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  swiftpaywebcheckout:
    container_name: swiftpaywebcheckout
    build:
      context: ../swiftpay-web-checkout
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SWIFTPAY_API_PAYMENT_URL: https://swiftpayment.info/api/payment
    image: swiftpaywebcheckout:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      swiftpayapipayment:
        condition: service_healthy
    ports:
      - "127.0.0.1:5002:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_SWIFTPAY_API_PAYMENT_URL: http://swiftpayapipayment:5166
      NEXT_PUBLIC_SWIFTPAY_API_PAYMENT_URL: https://swiftpayment.info/api/payment
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  swiftpaydb_data:
  swiftpaylogsdb_data:
  swiftpayrabbitmq_data:
  swiftpayvalkey_data:
  swiftpaystorage_data: