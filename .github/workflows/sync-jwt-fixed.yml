name: Sync JWT Fixed
on: workflow_dispatch
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            FIXED="9e8c40310eda27d464d385b072ec0af7c2a1c3c812c032dd793d408045bbfc08"
            echo "Syncing to $FIXED"
            for F in $(find /root -name "*.env*" -type f 2>/dev/null | head -n 20); do
              if grep -q "JWT" "$F" 2>/dev/null; then
                echo "Sync $F"
                cp "$F" "$F.bak.$(date +%s)" || true
                sed -i "s|^JWTSettings__Secret=.*|JWTSettings__Secret=$FIXED|" "$F" 2>/dev/null || true
                sed -i "s|^JWT_SECRET=.*|JWTSettings__Secret=$FIXED|" "$F" 2>/dev/null || true
                sed -i "s|^PAYMENT_JWT_SECRET=.*|PAYMENT_JWT_SECRET=$FIXED|" "$F" 2>/dev/null || true
                sed -i "s|^API_JWT_SECRET=.*|API_JWT_SECRET=$FIXED|" "$F" 2>/dev/null || true
                if ! grep -q "JWTSettings__Secret" "$F"; then echo "JWTSettings__Secret=$FIXED" >> "$F"; fi
              fi
            done
            echo "=== After ==="
            for F in $(find /root -name "*.env*" -type f 2>/dev/null | head -n 20); do echo "--- $F ---"; grep -i JWT "$F" 2>&1 | head -n 2 || true; done
            echo "Restarting"
            cd /root/swiftpay/swiftpay-api 2>/dev/null && docker compose -f docker-compose.production.yaml restart swiftpayapi 2>&1 | head -n 20 || docker restart swiftpayapi 2>&1 | head -n 20 || true
            cd /root/swiftpay/swiftpay-api-payment 2>/dev/null && docker compose -f docker-compose.production.yaml restart swiftpayapipayment 2>&1 | head -n 20 || docker restart swiftpayapipayment 2>&1 | head -n 20 || true
            sleep 5
            docker exec swiftpayapi env 2>&1 | grep JWT | head -n 3 || true
            docker exec swiftpayapipayment env 2>&1 | grep JWT | head -n 3 || true
