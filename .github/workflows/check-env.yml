name: Check Env
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== ls ==="
            ls -l /root/swiftpay/*.env* 2>&1 | head -n 20
            ls -l /root/swiftpay/swiftpay-api/*.env* 2>&1 | head -n 20
            ls -l /root/swiftpay/swiftpay-api-payment/*.env* 2>&1 | head -n 20
            echo "=== grep JWT ==="
            for F in /root/swiftpay/.env.production /root/swiftpay/swiftpay-api/.env.production /root/swiftpay/swiftpay-api-payment/.env.production /root/swiftpay/swiftpay-api/.env /root/swiftpay/swiftpay-api-payment/.env; do echo "--- $F ---"; grep -i JWT "$F" 2>&1 | head -n 5 || echo "no file or no JWT"; done
            echo "=== docker env ==="
            docker exec swiftpayapipayment env 2>&1 | grep -i JWT | head -n 5 || true
            docker exec swiftpayapi env 2>&1 | grep -i JWT | head -n 5 || true
