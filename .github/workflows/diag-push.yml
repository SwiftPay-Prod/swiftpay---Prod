name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== merchant 05722648 owner ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"Id\", \"UserId\", \"Name\" FROM \"Merchants\" WHERE \"Id\"='05722648-fa1a-41c2-8389-ec50a80cf576';" 2>&1 | head -20
            echo "=== token for that owner ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"UserId\", left(\"Token\",12) as tok, \"Platform\", \"IsActive\", \"UpdatedAt\" FROM \"PushTokens\" WHERE \"UserId\"=(SELECT \"UserId\" FROM \"Merchants\" WHERE \"Id\"='05722648-fa1a-41c2-8389-ec50a80cf576') ORDER BY \"UpdatedAt\" DESC;" 2>&1 | head -20
            echo "=== prefs for that owner ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"UserId\", \"PushNotificationsEnabled\", \"NotifyPaymentPending\", \"UpdatedAt\" FROM \"UserNotificationPreferences\" WHERE \"UserId\"=(SELECT \"UserId\" FROM \"Merchants\" WHERE \"Id\"='05722648-fa1a-41c2-8389-ec50a80cf576');" 2>&1 | head -20
            echo "=== rabbit queue ==="
            docker exec swiftpay-rabbitmq rabbitmqctl list_queues name messages 2>&1 | head -20 || docker exec swiftpay-rabbitmq rabbitmqctl list_queues 2>&1 | head -20
            echo "=== swiftpayapi logs last push ==="
            docker logs swiftpayapi --since 60m 2>&1 | grep -i "push\|PaymentPending\|Enqueue" | tail -30 || echo "no push logs"
