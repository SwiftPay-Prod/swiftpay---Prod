name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== last 5 Payments (Link) ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"Id\", \"Amount\", \"Status\", \"IsPaymentLinkPayment\", \"IsCheckoutPayment\", \"RequestSource\", \"SuppressWebhookAndNotification\", \"CreatedAt\" FROM \"Payments\" ORDER BY \"CreatedAt\" DESC LIMIT 5;" 2>&1 | head -40
            echo "=== last 5 Notifications ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"Title\", \"StatusType\", \"Type\", \"CreatedAt\" FROM \"Notifications\" ORDER BY \"CreatedAt\" DESC LIMIT 5;" 2>&1 | head -40
            echo "=== push-diag payment 10m ==="
            docker logs swiftpayapipayment --since 10m 2>&1 | grep -i "push-diag" | tail -20 || echo "no push-diag payment"
            echo "=== push-diag api 10m ==="
            docker logs swiftpayapi --since 10m 2>&1 | grep -i "push-diag" | tail -20 || echo "no push-diag api"
            echo "=== swiftpayapipayment logs last Link ==="
            docker logs swiftpayapipayment --since 20m 2>&1 | grep -i "PaymentLink\|CreateForLink\|Transaction" | tail -30 || echo "no link logs"
