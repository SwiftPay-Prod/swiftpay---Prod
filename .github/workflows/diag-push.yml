name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== all checkouts ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"ShortId\", \"Name\", \"MerchantId\", \"CreatedAt\" FROM \"Checkouts\" ORDER BY \"CreatedAt\" DESC LIMIT 10;" 2>&1 | head -30
            echo "=== checkout with ILIKE ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"ShortId\" FROM \"Checkouts\" WHERE \"ShortId\" ILIKE '%h7n2%' OR \"ShortId\" ILIKE '%nkvp%' ;" 2>&1 | head -20
            echo "=== push-diag 30m ==="
            docker logs swiftpayapi --since 30m 2>&1 | grep -i "push-diag" | tail -50 || echo "no push-diag"
            echo "=== pushTokens count ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT count(*) as totalTokens FROM \"PushTokens\";" 2>&1 | head -10
            echo "=== pushTokens detailed ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"UserId\", \"Platform\", \"IsActive\", \"UpdatedAt\" FROM \"PushTokens\" ORDER BY \"UpdatedAt\" DESC LIMIT 10;" 2>&1 | head -30
            echo "=== prefs for recent users ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"UserId\", \"PushNotificationsEnabled\", \"NotifyPaymentPending\" FROM \"UserNotificationPreferences\" ORDER BY \"UpdatedAt\" DESC LIMIT 10;" 2>&1 | head -20
