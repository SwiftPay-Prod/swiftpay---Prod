name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== swiftpayapi logs 10m ==="
            docker logs swiftpayapi --since 10m 2>&1 | tail -100 | head -80
            echo "=== push consumer 10m ==="
            docker logs swiftpayapi --since 10m 2>&1 | grep -i "push\|FCM\|firebase\|Notification" | tail -50 || echo "no push logs"
            echo "=== rabbit queues ==="
            docker exec swiftpayrabbitmq rabbitmqctl list_queues name messages consumers 2>&1 | head -20
            echo "=== last Payments ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"CreatedAt\", \"Status\", left(\"Id\"::text,8) as id FROM \"Payments\" ORDER BY \"CreatedAt\" DESC LIMIT 3;" 2>&1 | head -20
