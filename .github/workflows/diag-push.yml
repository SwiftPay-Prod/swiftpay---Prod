name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== docker ps ==="
            docker ps --format '{{.Names}} {{.Status}}' 2>&1 | head -20
            echo "=== push-diag swiftpayapipayment 60m ==="
            docker logs swiftpayapipayment --since 60m 2>&1 | grep -i "push-diag" | tail -50 || echo "no push-diag payment"
            echo "=== push-diag swiftpayapi 60m ==="
            docker logs swiftpayapi --since 60m 2>&1 | grep -i "push-diag" | tail -50 || echo "no push-diag api"
            echo "=== FCM config swiftpayapipayment env ==="
            docker exec swiftpayapipayment env 2>&1 | grep -i "FIREBASE\|FCM\|GOOGLE" | head -20 || echo "no fcm env"
            echo "=== last Payments with notification check ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT p.\"Id\", p.\"Status\", p.\"MerchantId\", p.\"Amount\", p.\"CreatedAt\", p.\"SuppressWebhookAndNotification\" FROM \"Payments\" p ORDER BY p.\"CreatedAt\" DESC LIMIT 5;" 2>&1 | head -20
