name: Diag Push
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== UserNotificationTemplates for merchant owner ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"UserId\", \"Type\", \"StatusType\", \"TitleTemplate\", left(\"BodyTemplate\",40) as body, \"UpdatedAt\" FROM \"UserNotificationTemplates\" WHERE \"UserId\"=(SELECT \"UserId\" FROM \"Merchants\" WHERE \"Id\"='05722648-fa1a-41c2-8389-ec50a80cf576') ORDER BY \"UpdatedAt\" DESC;" 2>&1 | head -30
            echo "=== all UserNotificationTemplates ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT count(*) FROM \"UserNotificationTemplates\";" 2>&1 | head -10
            echo "=== last Notifications with titles ==="
            docker exec swiftpaydb psql -U swiftpayuser -d swiftpay -c "SELECT \"Title\", \"Message\", \"Type\", \"StatusType\", \"CreatedAt\" FROM \"Notifications\" ORDER BY \"CreatedAt\" DESC LIMIT 5;" 2>&1 | head -30
            echo "=== swiftpayapi push logs last 10m ==="
            docker logs swiftpayapi --since 10m 2>&1 | grep -E "push-diag|Failed to get Firebase|Venda|Pagamento pendente" | tail -20 || echo "no logs"
