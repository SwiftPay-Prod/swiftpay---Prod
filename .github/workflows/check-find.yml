name: Find Env
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== find env ==="
            find /root -maxdepth 5 -name "*.env*" -type f 2>/dev/null | head -n 20
            echo "=== find compose ==="
            find /root -maxdepth 5 -name "docker-compose*" -type f 2>/dev/null | head -n 20
            echo "=== cat api compose ==="
            cat /root/swiftpay/swiftpay-api/docker-compose.production.yaml 2>&1 | head -n 50 || echo "no api compose"
            echo "=== cat root compose ==="
            cat /root/swiftpay/docker-compose.production.yaml 2>&1 | head -n 50 || echo "no root compose"
            echo "=== env ls ==="
            ls -l /root/swiftpay/*.env* 2>&1 | head -n 20 || true
            ls -l /root/swiftpay/swiftpay-api/*.env* 2>&1 | head -n 20 || true
            ls -l /root/swiftpay/swiftpay-api-payment/*.env* 2>&1 | head -n 20 || true
