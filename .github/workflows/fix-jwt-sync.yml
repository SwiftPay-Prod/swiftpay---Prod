name: Fix JWT Sync
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            NEW_SECRET="9e8c40310eda27d464d385b072ec0af7c2a1c3c812c032dd793d408045bbfc08"
            echo "Syncing to $NEW_SECRET"
            for F in /root/swiftpay/swiftpay-api/.env /root/swiftpay/swiftpay-api/.env.production /root/swiftpay/swiftpay-api-payment/.env /root/swiftpay/swiftpay-api-payment/.env.production /root/swiftpay/.env.production; do
              if [ -f "$F" ]; then echo "Sync $F"; cp "$F" "$F.bak.$(date +%s)" || true; sed -i "s|^JWTSettings__Secret=.*|JWTSettings__Secret=$NEW_SECRET|" "$F" 2>/dev/null || echo "JWTSettings__Secret=$NEW_SECRET" >> "$F"; grep -i JWT "$F" | head -n 3; fi
            done
            echo "Restarting payment and api"
            cd /root/swiftpay
            docker compose -f docker-compose.production.yaml restart swiftpayapi swiftpayapipayment || docker restart swiftpayapi swiftpayapipayment || true
            sleep 5
            docker exec swiftpayapi env 2>&1 | grep JWT | head -n 3 || true
            docker exec swiftpayapipayment env 2>&1 | grep JWT | head -n 3 || true
