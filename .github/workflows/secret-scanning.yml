name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          echo "Checking for common secret patterns in committed files..."
          
          # Check for hardcoded passwords
          if grep -r -E "(password|passwd|pwd|secret|api_key|apikey|token|credential|private_key)\s*[:=]\s*['\"][^'\"]{8,}['\"]" --include="*.cs" --include="*.json" --include="*.yaml" --include="*.yml" --include="*.sh" --exclude-dir=.git --exclude="*.example" --exclude="*appsettings.Example.json" .; then
            echo "ERROR: Potential hardcoded secrets found!"
            exit 1
          fi
          
          # Check for .env.production being tracked
          if git ls-files | grep -q "\.env\.production$"; then
            echo "ERROR: .env.production should not be committed!"
            exit 1
          fi
          
          # Check for service account JSON files
          if git ls-files | grep -qE "\.json$" | grep -qE "(service-account|credentials|firebase)"; then
            echo "WARNING: Potential service account JSON files found in git"
          fi
          
          echo "Secret scan passed"
