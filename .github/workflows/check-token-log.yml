name: Check Token Log
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== payment logs last 200 ==="
            docker logs --tail=200 swiftpayapipayment 2>&1 | tail -n 200 || true
            echo "=== grep JWT ==="
            docker logs --tail=500 swiftpayapipayment 2>&1 | grep -i -A2 -B2 "JWT\|invalid_token\|OnTokenValidated\|OnAuthenticationFailed" | tail -n 100 || true
