name: Deploy SwiftPay

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy"
        required: false
        type: choice
        default: "api payment web checkout"
        options:
          - api
          - payment
          - web
          - checkout
          - api payment
          - web checkout
          - api payment web checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy SwiftPay services
        uses: appleboy/ssh-action@v1
        with:
          host: 169.58.70.201
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            cd /root/swiftpay

            git fetch origin main
            git reset --hard origin/main

            cd /root/swiftpay/swiftpay-api

            ENV_FILE=".env.production"
            if [ ! -f "${ENV_FILE}" ]; then
              if [ -f "/root/swiftpay/.env.production" ]; then
                ENV_FILE="/root/swiftpay/.env.production"
              else
                ENV_FILE=".env"
              fi
            fi

            COMPOSE_FILE="docker-compose.production.yaml"

            docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" config --quiet
            docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --build --wait --wait-timeout 240 swiftpayweb swiftpaywebcheckout swiftpayapi swiftpayapipayment

            curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:3001/ || true
            curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:5002/ || true
            curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:5279/health/live || true
            curl --fail --silent --show-error --retry 10 --retry-all-errors http://127.0.0.1:5166/health/live || true

            docker image prune -f || true
